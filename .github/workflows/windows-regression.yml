name: Windows develop regression

on:
  workflow_dispatch:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  tests:
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[windows-regression]'))
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      COMPANION_NO_SPAWN: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.14'
          architecture: x64
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-dev.txt playwright==1.65.2
          python -m playwright install chromium
      - name: Verify offline clean install
        run: python tools/clean_install_check.py
      - name: Run regression tests with temporary profiles
        run: >-
          python -m pytest -q -rs
          tests/test_core.py
          tests/test_live_provider.py
          tests/test_community.py
          tests/test_shared_community.py
          tests/test_phenomena.py
          tests/test_sprites.py::test_artwork_only_in_the_prepared_builtin_library
          tests/ui/test_ui_builtin_maps.py::test_no_rom_or_dump_files_in_repository
          tests/ui/test_ui_breeding_plan.py
          tests/ui/test_ui_community.py
          tests/ui/test_ui_shared_community.py
