name: Windows x64 development build

on:
  workflow_dispatch:
    inputs:
      upload_private_artifact:
        description: Upload the ZIP to this private repository after asset approval
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    if: github.event.repository.private && github.ref == 'refs/heads/develop'
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.14'
          architecture: x64
      - name: Build Windows ZIP
        shell: pwsh
        run: .\packaging\windows\build.ps1 -PythonExecutable (Get-Command python).Source
      - name: Verify the frozen app and ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $smokeRoot = Join-Path $env:RUNNER_TEMP "companion-smoke-${{ github.run_id }}-${{ github.run_attempt }}"
          $profileDir = Join-Path $smokeRoot 'fresh profile'
          $unpacked = Join-Path $smokeRoot 'extracted package'
          $line = (Get-Content 'dist\SHA256SUMS' -Raw).Trim() -split '  ', 2
          $zip = (Resolve-Path -LiteralPath (Join-Path 'dist' $line[1])).Path
          $checksum = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
          if ($checksum -ne $line[0]) { throw 'ZIP checksum mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath $unpacked
          $exe = Join-Path $unpacked 'pokemmo-companion\pokemmo-companion.exe'
          $test = Start-Process -FilePath $exe -WorkingDirectory $smokeRoot -ArgumentList '--check', '--data-dir', "`"$profileDir`"" -Wait -PassThru
          if ($test.ExitCode -ne 0 -or !(Test-Path -LiteralPath (Join-Path $profileDir 'companion.sqlite3'))) {
            throw 'The extracted portable ZIP did not pass its fresh-profile self-check'
          }
      - name: Upload approved private development artifact
        if: inputs.upload_private_artifact && vars.ASSET_REDISTRIBUTION_APPROVED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: companion-windows-x64-${{ github.sha }}
          path: |
            dist/PokeMMO-Companion-*-windows-x86_64.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
