name: Verify release packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Approved exact release tag, for example v0.8.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: windows
          - runner: ubuntu-22.04
            target: linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the approved tag on main
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0\.(8|9)|[1-9][0-9]*\.(0|[1-9][0-9]*))\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.14'
          architecture: x64
      - name: Install Linux dependencies and verify pinned AppImage tools
        if: matrix.target == 'linux'
        env:
          APPIMAGETOOL_SHA256: 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0'
          APPIMAGE_RUNTIME_SHA256: '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libegl1 libgl1 libnss3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/runtime-x86_64" \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          printf '%s  %s\n' "$APPIMAGETOOL_SHA256" "$RUNNER_TEMP/appimagetool" \
            "$APPIMAGE_RUNTIME_SHA256" "$RUNNER_TEMP/runtime-x86_64" | sha256sum --check
          chmod +x "$RUNNER_TEMP/appimagetool"
          {
            printf 'COMPANION_APPIMAGETOOL=%s\n' "$RUNNER_TEMP/appimagetool"
            printf 'COMPANION_APPIMAGE_RUNTIME=%s\n' "$RUNNER_TEMP/runtime-x86_64"
          } >> "$GITHUB_ENV"
      - name: Build and verify native package
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python packaging/package_release.py build --tag "$RELEASE_TAG"
